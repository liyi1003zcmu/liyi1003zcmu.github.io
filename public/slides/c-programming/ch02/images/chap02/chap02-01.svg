<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Drop shadow filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.06" />
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2056a8" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1400" height="760" rx="16" fill="#ffffff" />

  <!-- Main Title Banner -->
  <g transform="translate(45, 45)">
    <rect x="0" y="-24" width="9" height="32" fill="#2056a8" rx="4" />
    <text x="22" y="0" font-size="30" font-weight="800" fill="#163f78" letter-spacing="0.5">C语言程序结构解剖图</text>
    <text x="340" y="0" font-size="18" fill="#5b6573" font-weight="500">（语法要素、执行逻辑与结构映射）</text>
  </g>

  <!-- Left Side: Code Editor Container -->
  <g transform="translate(45, 70)">
    <!-- Main Window Outer -->
    <rect width="590" height="535" rx="16" fill="#ffffff" stroke="#cbd8e6" stroke-width="2" filter="url(#shadow)" />
    
    <!-- Titlebar -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 574 0 A 16 16 0 0 1 590 16 L 590 44 L 0 44 Z" fill="#edf4fb" stroke="#cbd8e6" stroke-width="1" />
    <circle cx="24" cy="22" r="7" fill="#ff5f56" />
    <circle cx="44" cy="22" r="7" fill="#ffbd2e" />
    <circle cx="64" cy="22" r="7" fill="#27c93f" />
    <text x="295" y="28" text-anchor="middle" font-size="16" font-family="'Cascadia Code', Consolas, monospace" fill="#46709f" font-weight="700">main.c</text>

    <!-- Code Content with TSPANS for 100% Monospace Precision -->
    <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="600" letter-spacing="0">
      
      <!-- Line 1: #include <stdio.h> -->
      <text x="36" y="90" xml:space="preserve"><tspan fill="#b42318">#include </tspan><tspan fill="#1d7a46">&lt;stdio.h&gt;</tspan></text>

      <!-- Line 2: int main(void) -->
      <text x="36" y="142" xml:space="preserve"><tspan fill="#174ea6">int </tspan><tspan fill="#6d28d9">main</tspan><tspan fill="#1f2937">(void)</tspan></text>

      <!-- Line 3: { -->
      <text x="36" y="194" fill="#163f78" font-weight="800">{</text>

      <!-- Line 4:     double a, b, avg; -->
      <text x="36" y="246" xml:space="preserve"><tspan fill="#1f2937">    </tspan><tspan fill="#174ea6">double </tspan><tspan fill="#1f2937">a, b, avg;</tspan></text>

      <!-- Line 5:     scanf("%lf%lf", &a, &b); -->
      <text x="36" y="298" xml:space="preserve"><tspan fill="#1f2937">    </tspan><tspan fill="#6d28d9">scanf</tspan><tspan fill="#1f2937">(</tspan><tspan fill="#a65b00">"%lf%lf"</tspan><tspan fill="#1f2937">, &amp;a, &amp;b);</tspan></text>

      <!-- Line 6:     avg = (a + b) / 2.0; -->
      <text x="36" y="350" xml:space="preserve"><tspan fill="#1f2937">    avg = (a + b) / </tspan><tspan fill="#a65b00">2.0</tspan><tspan fill="#1f2937">;</tspan></text>

      <!-- Line 7:     printf("%.1f
", avg); -->
      <text x="36" y="402" xml:space="preserve"><tspan fill="#1f2937">    </tspan><tspan fill="#6d28d9">printf</tspan><tspan fill="#1f2937">(</tspan><tspan fill="#a65b00">"%.1f
"</tspan><tspan fill="#1f2937">, avg);</tspan></text>

      <!-- Line 8:     return 0; -->
      <text x="36" y="454" xml:space="preserve"><tspan fill="#1f2937">    </tspan><tspan fill="#174ea6">return </tspan><tspan fill="#a65b00">0</tspan><tspan fill="#1f2937">;</tspan></text>

      <!-- Line 9: } -->
      <text x="36" y="506" fill="#163f78" font-weight="800">}</text>

    </g>
  </g>

  <!-- Left Side Bottom Annotations -->
  <g transform="translate(45, 625)">
    <!-- Function Body Box -->
    <g transform="translate(0, 0)">
      <rect width="285" height="100" rx="14" fill="#f7f9fc" stroke="#c6d5e8" stroke-width="1.5" filter="url(#card-shadow)" />
      <path d="M 14 20 C 6 20 6 50 0 50 C 6 50 6 80 14 80" fill="none" stroke="#2056a8" stroke-width="3" />
      <text x="32" y="38" font-size="18" font-weight="800" fill="#163f78">函数体（Function Body）</text>
      <text x="32" y="66" font-size="15" fill="#46709f" font-weight="500">花括号 { } 内包含的全部代码指令</text>
    </g>

    <!-- Semicolon Notice Box -->
    <g transform="translate(305, 0)">
      <rect width="285" height="100" rx="14" fill="#fffaf0" stroke="#fbd38d" stroke-width="1.5" filter="url(#card-shadow)" />
      <circle cx="30" cy="50" r="18" fill="#feebc8" />
      <text x="30" y="57" font-size="24" font-weight="800" fill="#a65b00" text-anchor="middle">;</text>
      <text x="60" y="38" font-size="18" font-weight="800" fill="#a65b00">语句结束符（分号）</text>
      <text x="60" y="66" font-size="15" fill="#7b341e" font-weight="500">C语言每条执行语句末尾必带 ;</text>
    </g>
  </g>

  <!-- Connecting Lines with Smooth Slopes & Arrow Heads -->
  <g fill="none" stroke="#2056a8" stroke-width="2.5" opacity="0.85">
    <!-- Arrow 1: Preprocessor -->
    <path d="M 670 103 L 340 160" marker-end="url(#arrow)" />
    
    <!-- Arrow 2: Main Function -->
    <path d="M 670 178 L 300 212" marker-end="url(#arrow)" />
    
    <!-- Arrow 3: Variable Declaration -->
    <path d="M 670 253 L 390 316" marker-end="url(#arrow)" />
    
    <!-- Arrow 4: Scanf Input -->
    <path d="M 670 328 L 440 368" marker-end="url(#arrow)" />
    
    <!-- Arrow 5: Calculation -->
    <path d="M 670 403 L 440 420" marker-end="url(#arrow)" />
    
    <!-- Arrow 6: Printf Output -->
    <path d="M 670 478 L 420 472" marker-end="url(#arrow)" />
    
    <!-- Arrow 7: Return Statement -->
    <path d="M 670 553 L 310 524" marker-end="url(#arrow)" />
  </g>

  <!-- Right Side: 7 Large Structured Explanation Cards -->
  <g transform="translate(670, 70)">

    <!-- Card 1: 预处理命令 -->
    <g transform="translate(0, 0)">
      <rect width="685" height="66" rx="12" fill="#eaf4ff" stroke="#b6d7fe" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="10" height="66" fill="#2056a8" rx="4" />
      <text x="26" y="28" font-size="19" font-weight="800" fill="#163f78">1. 预处理命令</text>
      <text x="220" y="28" font-size="16" font-family="'Cascadia Code', Consolas, monospace" font-weight="700" fill="#b42318">#include &lt;stdio.h&gt;</text>
      <text x="26" y="52" font-size="15" fill="#48627f">引入标准输入输出库头文件，包含 printf/scanf 函数声明</text>
    </g>

    <!-- Card 2: 主函数 -->
    <g transform="translate(0, 75)">
      <rect width="685" height="66" rx="12" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="10" height="66" fill="#2c7be5" rx="4" />
      <text x="26" y="28" font-size="19" font-weight="800" fill="#163f78">2. 主函数首部</text>
      <text x="220" y="28" font-size="16" font-family="'Cascadia Code', Consolas, monospace" font-weight="700" fill="#174ea6">int main(void)</text>
      <text x="26" y="52" font-size="15" fill="#5b6573">程序的唯一入口函数，CPU 总是从 main() 的第一条指令开始执行</text>
    </g>

    <!-- Card 3: 变量定义 -->
    <g transform="translate(0, 150)">
      <rect width="685" height="66" rx="12" fill="#eaf4ff" stroke="#b6d7fe" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="10" height="66" fill="#2056a8" rx="4" />
      <text x="26" y="28" font-size="19" font-weight="800" fill="#163f78">3. 变量定义语句</text>
      <text x="220" y="28" font-size="16" font-family="'Cascadia Code', Consolas, monospace" font-weight="700" fill="#174ea6">double a, b, avg;</text>
      <text x="26" y="52" font-size="15" fill="#48627f">在内存中为双精度浮点数分配空间，分别命名为 a、b 和 avg</text>
    </g>

    <!-- Card 4: 输入语句 -->
    <g transform="translate(0, 225)">
      <rect width="685" height="66" rx="12" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="10" height="66" fill="#2c7be5" rx="4" />
      <text x="26" y="28" font-size="19" font-weight="800" fill="#163f78">4. 输入语句</text>
      <text x="220" y="28" font-size="16" font-family="'Cascadia Code', Consolas, monospace" font-weight="700" fill="#6d28d9">scanf("%lf%lf", &amp;a, &amp;b);</text>
      <text x="26" y="52" font-size="15" fill="#5b6573">从键盘读取用户输入的两个数值，按地址存入变量 a 与 b</text>
    </g>

    <!-- Card 5: 计算语句 -->
    <g transform="translate(0, 300)">
      <rect width="685" height="66" rx="12" fill="#eaf4ff" stroke="#b6d7fe" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="10" height="66" fill="#2056a8" rx="4" />
      <text x="26" y="28" font-size="19" font-weight="800" fill="#163f78">5. 计算与赋值语句</text>
      <text x="220" y="28" font-size="16" font-family="'Cascadia Code', Consolas, monospace" font-weight="700" fill="#2056a8">avg = (a + b) / 2.0;</text>
      <text x="26" y="52" font-size="15" fill="#48627f">计算表达式 (a+b)/2.0 的浮点数值，并将其赋值存入变量 avg</text>
    </g>

    <!-- Card 6: 输出语句 -->
    <g transform="translate(0, 375)">
      <rect width="685" height="66" rx="12" fill="#ffffff" stroke="#d8e1ec" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="10" height="66" fill="#2c7be5" rx="4" />
      <text x="26" y="28" font-size="19" font-weight="800" fill="#163f78">6. 输出语句</text>
      <text x="220" y="28" font-size="16" font-family="'Cascadia Code', Consolas, monospace" font-weight="700" fill="#6d28d9">printf("%.1f
", avg);</text>
      <text x="26" y="52" font-size="15" fill="#5b6573">将变量 avg 的数值保留 1 位小数格式化输出显示在屏幕上</text>
    </g>

    <!-- Card 7: 返回语句 -->
    <g transform="translate(0, 450)">
      <rect width="685" height="66" rx="12" fill="#eaf4ff" stroke="#b6d7fe" stroke-width="1.5" filter="url(#card-shadow)" />
      <rect x="0" y="0" width="10" height="66" fill="#2056a8" rx="4" />
      <text x="26" y="28" font-size="19" font-weight="800" fill="#163f78">7. 返回语句</text>
      <text x="220" y="28" font-size="16" font-family="'Cascadia Code', Consolas, monospace" font-weight="700" fill="#174ea6">return 0;</text>
      <text x="26" y="52" font-size="15" fill="#48627f">向操作系统返回状态码 0，标志着 main() 函数正常执行完毕</text>
    </g>

  </g>
</svg>
