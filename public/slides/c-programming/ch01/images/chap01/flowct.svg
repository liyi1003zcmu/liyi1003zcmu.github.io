<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 760" role="img" aria-labelledby="title"><title id="title">求偶数和流程图</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#6683a6"/></marker></defs><style>text{font-family:"Microsoft YaHei",sans-serif;fill:#173d70;font-size:25px}.n{fill:#f7fbff;stroke:#2c7be5;stroke-width:3}.a{stroke:#6683a6;stroke-width:4;fill:none;marker-end:url(#a)}</style><ellipse cx="310" cy="45" rx="90" ry="32" class="n"/><text x="310" y="54" text-anchor="middle">开始</text><path d="M310 77v48" class="a"/><rect x="190" y="130" width="240" height="70" rx="12" class="n"/><text x="310" y="174" text-anchor="middle">sum = 0, i = 2</text><path d="M310 200v55" class="a"/><path d="M310 255l120 72-120 72-120-72z" class="n"/><text x="310" y="335" text-anchor="middle">i ≤ 100？</text><path d="M310 399v55" class="a"/><text x="327" y="430">是</text><rect x="180" y="460" width="260" height="70" rx="12" class="n"/><text x="310" y="504" text-anchor="middle">sum += i; i += 2</text><path d="M180 495H95V327h85" class="a"/><path d="M430 327h105v190" class="a"/><text x="475" y="313">否</text><path d="M535 517v55" class="a"/><rect x="425" y="580" width="220" height="70" rx="12" class="n"/><text x="535" y="624" text-anchor="middle">输出 sum</text><path d="M535 650v45" class="a"/><ellipse cx="535" cy="725" rx="82" ry="28" class="n"/><text x="535" y="734" text-anchor="middle">结束</text></svg>
