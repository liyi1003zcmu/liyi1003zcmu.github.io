<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">结构化程序设计</title>
  <desc id="desc">顺序、分支和循环三种基本控制结构</desc>
  <style>text{font-family:"Microsoft YaHei",sans-serif;fill:#173d70}.title{font-size:34px;font-weight:700}.label{font-size:28px;font-weight:700}.sub{font-size:22px;fill:#52667f}.box{fill:#f7fbff;stroke:#2c7be5;stroke-width:3}.arrow{stroke:#6683a6;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6683a6"/></marker></defs>
  <text x="450" y="48" text-anchor="middle" class="title">结构化程序设计的三种基本结构</text>
  <rect x="45" y="105" width="230" height="230" rx="22" class="box"/><rect x="335" y="105" width="230" height="230" rx="22" class="box"/><rect x="625" y="105" width="230" height="230" rx="22" class="box"/>
  <text x="160" y="165" text-anchor="middle" class="label">顺序结构</text><path d="M160 195v75" class="arrow"/><text x="160" y="305" text-anchor="middle" class="sub">按次序逐条执行</text>
  <text x="450" y="165" text-anchor="middle" class="label">分支结构</text><path d="M450 195v42m0 0-55 45m55-45 55 45" class="arrow"/><text x="450" y="305" text-anchor="middle" class="sub">按条件选择路径</text>
  <text x="740" y="165" text-anchor="middle" class="label">循环结构</text><path d="M700 270c-55-85 125-105 80 5" class="arrow"/><text x="740" y="305" text-anchor="middle" class="sub">重复执行一组操作</text>
</svg>
