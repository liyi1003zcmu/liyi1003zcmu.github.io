<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="../demo.css" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <title>Rotating Square</title>

    <script id="vertex-shader" type="x-shader/x-vertex">
      #version 300 es

      in vec4 aPosition;
      uniform float uTheta;

      void
      main()
      {
          float s = sin(uTheta);
          float c = cos(uTheta);

          gl_Position.x = -s*aPosition.y + c*aPosition.x;
          gl_Position.y =  s*aPosition.x + c*aPosition.y;
          gl_Position.z = 0.0;
          gl_Position.w = 1.0;
      }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
      #version 300 es
      precision mediump float;

      out vec4 fColor;

      void
      main()
      {
          fColor = vec4(1.0, 0.0, 0.0, 1.0);
      }
    </script>

    <script type="text/javascript" src="../js/common/initShaders.js"></script>
    <script type="text/javascript" src="../js/common/MVnew.js"></script>
    <script type="text/javascript" src="../js/ch03/rotatingSquare1.js"></script>
  </head>

  <body>
    <canvas id="gl-canvas" width="512" height="512">
      Oops ... your browser doesn't support the HTML5 canvas element
    </canvas>
  </body>
</html>
