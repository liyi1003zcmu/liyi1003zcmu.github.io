<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>第六章 Demo 2：旋转光照立方体</title>
    <link rel="stylesheet" href="../demo.css?v=20261101" />
  </head>

  <body>
    <button id="ButtonX">Rotate X</button>
    <button id="ButtonY">Rotate Y</button>
    <button id="ButtonZ">Rotate Z</button>
    <button id="ButtonT">Toggle Rotation</button>

    <script id="vertex-shader" type="x-shader/x-vertex">
      #version 300 es

      in  vec4 aPosition;
      in  vec3 aNormal;
      out vec4 vColor;

      uniform vec4 uAmbientProduct, uDiffuseProduct, uSpecularProduct;
      uniform mat4 uModelViewMatrix;
      uniform mat4 uProjectionMatrix;
      uniform vec4 uLightPosition;
      uniform float uShininess;

      void main()
      {


          vec3 pos = -(uModelViewMatrix * aPosition).xyz;

          //fixed light postion

          vec3 light = uLightPosition.xyz;
          vec3 L = normalize(light - pos);


          vec3 E = normalize(-pos);
          vec3 H = normalize(L + E);

          vec4 NN = vec4(aNormal,0);

          // Transform vertex normal into eye coordinates

          vec3 N = normalize((uModelViewMatrix*NN).xyz);

          // Compute terms in the illumination equation
          vec4 ambient = uAmbientProduct;

          float Kd = max(dot(L, N), 0.0);
          vec4  diffuse = Kd*uDiffuseProduct;

          float Ks = pow( max(dot(N, H), 0.0), uShininess );
          vec4  specular = Ks * uSpecularProduct;

          if( dot(L, N) < 0.0 ) {
      	  specular = vec4(0.0, 0.0, 0.0, 1.0);
          }

          gl_Position = uProjectionMatrix * uModelViewMatrix *aPosition;
          vColor = ambient + diffuse +specular;

          vColor.a = 1.0;
      }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
      #version 300 es

      precision mediump float;


      in vec4 vColor;
      out vec4 fColor;

      void
      main()
      {
          fColor = vColor;
      }
    </script>

    <script type="text/javascript" src="../js/common/initShaders.js"></script>
    <script type="text/javascript" src="../js/common/MVnew.js"></script>
    <script type="text/javascript" src="../js/ch06/shadedCube.js"></script>

    <canvas id="gl-canvas" width="512" height="512">
      Oops ... your browser doesn't support the HTML5 canvas element
    </canvas>
  </body>
</html>
